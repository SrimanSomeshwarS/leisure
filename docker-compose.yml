services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: leisure
      MYSQL_USER: leisure
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:   # local inbox for verification / reset emails: http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  api:
    build:
      context: .
      args: { INSTALL_DEV: "true" }
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://leisure:${MYSQL_PASSWORD}@db:3306/leisure?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://leisure:${MYSQL_PASSWORD}@db:3306/leisure_test?charset=utf8mb4
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/app"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  dbdata:
